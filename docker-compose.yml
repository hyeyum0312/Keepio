# 로컬 개발·통합 테스트 전용 DB. CI는 workflow의 postgres 서비스를 쓴다.
# 호스트 포트 7712: keepio 포트 블록(web 7710, api 7711, DB 7712). 다른 프로젝트의 3000번대·5432와 겹치지 않게 한다.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: keepio
      POSTGRES_PASSWORD: keepio_local
      POSTGRES_DB: keepio
    ports:
      - "127.0.0.1:7712:5432"
    volumes:
      - keepio-pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepio -d keepio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  keepio-pg:
