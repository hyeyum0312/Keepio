# 최종 품질 게이트. 로컬 hook은 우회 가능하므로 이 workflow가 기준이다(AGENTS.md).
name: CI
# PR은 바뀐 패키지만 검사하고(scripts/ci-scope.sh), 주 1회·수동 실행은 전체 검사한다.
# dev·stg·prod는 보호 브랜치라 PR로만 바뀌므로 push에서는 다시 돌리지 않는다(ADR-007).
on:
  pull_request:
    branches: [dev, stg, prod]
  schedule:
    - cron: "0 18 * * 0" # 매주 월요일 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keepio
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: keepio_test
        ports: ["5432:5432"]
        # runner가 따옴표 안 공백을 나누므로 인자 없는 명령만 쓴다(접속 수락 여부만 확인)
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # CI에는 개발 DB가 없다. 두 변수 모두 일회용 테스트 DB를 가리킨다.
      DATABASE_URL: postgresql://keepio:test_only@localhost:5432/keepio_test
      DATABASE_URL_TEST: postgresql://keepio:test_only@localhost:5432/keepio_test
      # web 운영 빌드는 API 주소가 없으면 실패한다(검증용 값)
      NEXT_PUBLIC_API_BASE_URL: http://localhost:7711
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 승격 경로 검사 (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE:$HEAD" in
            # 승격: dev→stg→prod, 긴급 수정: hotfix/*→prod 후 prod→stg→dev 역반영
            stg:dev | prod:stg | prod:hotfix/* | stg:prod | dev:stg) ;;
            dev:prod) echo "prod 변경은 stg를 거쳐 dev로 역반영한다(ADR-007)" >&2; exit 1 ;;
            dev:*) ;;
            *) echo "$HEAD → $BASE 는 허용되지 않는 경로다(ADR-007)" >&2; exit 1 ;;
          esac
      - name: HISTORY 보존 검사 (PR)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-history.py origin/${{ github.base_ref }}
      - run: npm ci
      - name: 검사 범위
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          bash scripts/ci-scope.sh "$BASE" >> "$GITHUB_OUTPUT"
          if grep -q '^turbo=--affected$' "$GITHUB_OUTPUT"; then echo "TURBO_SCM_BASE=$BASE" >> "$GITHUB_ENV"; fi
      # format:check·openapi:check는 매번 전체, lint·typecheck·unit test는 범위 내 패키지만
      - run: npm run verify -- ${{ steps.scope.outputs.turbo }}
      - if: steps.scope.outputs.api == 'true'
        run: npm run db:migrate:test
      - if: steps.scope.outputs.api == 'true'
        run: npm run test:integration -- ${{ steps.scope.outputs.turbo }}
      - run: npm run build -- ${{ steps.scope.outputs.turbo }}
