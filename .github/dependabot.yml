# 의존성 업데이트 PR. 공개 후 14일 지난 릴리스만 제안한다(공급망 위험·초기 버그 회피).
# PR은 CI(verify·통합·build)를 통과하고, 리뷰어가 docs/HISTORY.md 항목을 추가해야 머지할 수 있다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # 메이저는 별도 검토 후 직접 올린다. @types/node는 .nvmrc의 Node 메이저(24)와 맞춘다.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Seoul
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(ci)"
